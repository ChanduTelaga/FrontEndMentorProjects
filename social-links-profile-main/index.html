<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="card">
        <div class="image">
          <img src="assets/images/avatar-jessica.jpeg" alt="profile_pic" />
        </div>

        <div class="card_text">
          <h1>Jessica Randall</h1>
          <span>London, United Kingdom</span>

          <p>"Front-end developer and avid reader."</p>
        </div>

        <a href="#GitHub" target="_blank" class="card_links"> GitHub</a>
        <a href="#GitHub" target="_blank" class="card_links"> Frontend Mentor</a>
        <a href="#GitHub" target="_blank" class="card_links">LinkedIn</a>
        <a href="#GitHub" target="_blank" class="card_links">Twitter</a>
        <a href="#GitHub" target="_blank" class="card_links">Instagram</a>
        
      </div>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
